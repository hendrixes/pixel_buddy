{% extends "base.html" %}

{% block title %}Game - pixel_buddy{% endblock %}

{% block content %}
  <section class="game-panel">
    <img
      id="pet-screen"
      src="/game/screen.png"
      alt="Tela do pet"
      class="pet-screen"
    >

    <div class="game-actions">
      <a class="button-link" href="/agents">Agents</a>
      <a class="button-link" href="/blocked-ips">Blocklist</a>
      <a class="button-link" href="/pcaps/upload">PCAP</a>
      <a class="button-link" href="/leaderboard">Ranking</a>
    </div>
  </section>

  <script>
    const petScreen = document.getElementById("pet-screen");

    function refreshScreen() {
      petScreen.src = "/game/screen.png?t=" + Date.now();
    }

    setInterval(() => {
      refreshScreen();
    }, 1000);
  </script>
{% endblock %}
