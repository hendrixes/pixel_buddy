{% extends "base.html" %}

{% block title %}Nomear agente - pixel_buddy{% endblock %}

{% block content %}
  <section class="auth-panel">
    <h1>Nomear agente</h1>

    <form method="post" action="/game/setup">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>
        Nome do pet
        <input
          type="text"
          name="pet_name"
          required
          maxlength="80"
        >
      </label>

      <button type="submit">Criar pet</button>
    </form>
  </section>
{% endblock %}
