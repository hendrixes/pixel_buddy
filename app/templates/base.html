<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}pixel_buddy{% endblock %}</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "DejaVu Sans Mono", "Courier New", monospace;
        background: #f2f2f2;
        color: #000;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(#e8e8e8 1px, transparent 1px),
          linear-gradient(90deg, #e8e8e8 1px, transparent 1px),
          #f2f2f2;
        background-size: 24px 24px;
      }

      .site-header {
        background: #000;
        border-bottom: 4px solid #000;
        color: #fff;
        padding: 0 24px;
      }

      .site-header-inner {
        align-items: center;
        display: flex;
        justify-content: space-between;
        min-height: 52px;
        gap: 24px;
      }

      .site-header a {
        color: inherit;
        font-weight: 700;
        text-decoration: none;
        text-transform: lowercase;
      }

      .site-user {
        align-items: center;
        display: flex;
        gap: 16px;
        font-size: 0.95rem;
      }

      .logout-form {
        display: block;
        margin: 0;
      }

      .logout-button {
        background: #fff;
        border: 2px solid #fff;
        color: #000;
        padding: 8px 12px;
      }

      .logout-button:hover {
        background: #000;
        color: #fff;
      }

      main {
        width: min(960px, calc(100% - 32px));
        margin: 40px auto;
      }

      .auth-panel {
        width: min(420px, 100%);
        margin: 0 auto;
        background: #fff;
        border: 4px solid #000;
        border-radius: 0;
        padding: 24px;
        box-shadow: 8px 8px 0 #000;
      }

      .game-panel {
        width: min(760px, 100%);
        margin: 0 auto;
        background: #fff;
        border: 4px solid #000;
        border-radius: 0;
        padding: 28px;
        box-shadow: 8px 8px 0 #000;
      }

      .pet-screen {
        background: #000;
        border: 12px solid #000;
        display: block;
        image-rendering: pixelated;
        width: 100%;
      }

      .game-actions {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        margin-top: 18px;
      }

      .game-action-button {
        background: #000;
        border: 3px solid #000;
        color: #fff;
      }

      .game-action-button:hover {
        background: #fff;
        color: #000;
      }

      .game-action-button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.75rem;
        text-transform: uppercase;
      }

      p {
        line-height: 1.5;
      }

      a {
        color: #000;
        font-weight: 700;
      }

      form {
        display: grid;
        gap: 16px;
        margin-top: 24px;
      }

      label {
        display: grid;
        gap: 6px;
        font-weight: 700;
      }

      input,
      select {
        width: 100%;
        background: #fff;
        border: 3px solid #000;
        border-radius: 0;
        color: #000;
        font: inherit;
        padding: 10px 12px;
      }

      input:focus,
      select:focus {
        outline: 3px solid #000;
        outline-offset: 3px;
      }

      table {
        border-collapse: collapse;
        width: 100%;
      }

      th,
      td {
        border: 3px solid #000;
        padding: 10px;
        text-align: left;
      }

      th {
        background: #000;
        color: #fff;
        text-transform: uppercase;
      }

      button,
      .button-link {
        border: 3px solid #000;
        border-radius: 0;
        background: #000;
        color: #fff;
        cursor: pointer;
        display: inline-flex;
        justify-content: center;
        font: inherit;
        font-weight: 700;
        padding: 10px 14px;
        text-decoration: none;
        text-transform: uppercase;
      }

      button:hover,
      .button-link:hover {
        background: #fff;
        color: #000;
      }

      .muted {
        color: #333;
        margin-bottom: 0;
      }

      .form-footer {
        border-top: 3px solid #000;
        margin-top: 20px;
        padding-top: 16px;
      }

      .flash-list {
        display: grid;
        gap: 8px;
        list-style: none;
        margin: 0 0 20px;
        padding: 0;
      }

      .flash-list li {
        background: #fff;
        border: 3px solid #000;
        border-radius: 0;
        color: #000;
        padding: 10px 12px;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a href="/">pixel_buddy</a>

        {% if current_user.is_authenticated %}
          <div class="site-user">
            <span>Logado como {{ current_user.username }}</span>

            <form class="logout-form" method="post" action="/auth/logout">
              <button class="logout-button" type="submit">Sair</button>
            </form>
          </div>
        {% endif %}
      </div>
    </header>

    <main>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <ul class="flash-list">
            {% for message in messages %}
              <li>{{ message }}</li>
            {% endfor %}
          </ul>
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>
  </body>
</html>
