<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Tamagotchi{% endblock %}</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f6f8;
        color: #1f2933;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      .site-header {
        background: #17212f;
        color: #fff;
        padding: 0 24px;
      }

      .site-header-inner {
        align-items: center;
        display: flex;
        justify-content: space-between;
        min-height: 52px;
        gap: 24px;
      }

      .site-header a {
        color: inherit;
        font-weight: 700;
        text-decoration: none;
      }

      .site-user {
        align-items: center;
        display: flex;
        gap: 16px;
        font-size: 0.95rem;
      }

      .logout-form {
        display: block;
        margin: 0;
      }

      .logout-button {
        background: transparent;
        border: 1px solid rgb(255 255 255 / 45%);
        color: #fff;
        padding: 7px 12px;
      }

      main {
        width: min(960px, calc(100% - 32px));
        margin: 40px auto;
      }

      .auth-panel {
        width: min(420px, 100%);
        margin: 0 auto;
        background: #fff;
        border: 1px solid #d9e2ec;
        border-radius: 8px;
        padding: 24px;
        box-shadow: 0 10px 30px rgb(15 23 42 / 8%);
      }

      .game-panel {
        width: min(760px, 100%);
        margin: 0 auto;
        background: #fff;
        border: 1px solid #d9e2ec;
        border-radius: 8px;
        padding: 28px;
        box-shadow: 0 10px 30px rgb(15 23 42 / 8%);
      }

      .pet-screen {
        background: #111827;
        border: 10px solid #111827;
        display: block;
        image-rendering: pixelated;
        width: 100%;
      }

      .game-actions {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        margin-top: 18px;
      }

      .game-action-button {
        background: #111827;
      }

      .game-action-button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.75rem;
      }

      p {
        line-height: 1.5;
      }

      form {
        display: grid;
        gap: 16px;
        margin-top: 24px;
      }

      label {
        display: grid;
        gap: 6px;
        font-weight: 700;
      }

      input {
        width: 100%;
        border: 1px solid #bcccdc;
        border-radius: 6px;
        font: inherit;
        padding: 10px 12px;
      }

      button,
      .button-link {
        border: 0;
        border-radius: 6px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
        display: inline-flex;
        justify-content: center;
        font: inherit;
        font-weight: 700;
        padding: 10px 14px;
        text-decoration: none;
      }

      .muted {
        color: #52606d;
        margin-bottom: 0;
      }

      .form-footer {
        border-top: 1px solid #e4e7eb;
        margin-top: 20px;
        padding-top: 16px;
      }

      .flash-list {
        display: grid;
        gap: 8px;
        list-style: none;
        margin: 0 0 20px;
        padding: 0;
      }

      .flash-list li {
        background: #fff7ed;
        border: 1px solid #fed7aa;
        border-radius: 6px;
        color: #9a3412;
        padding: 10px 12px;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a href="/">Tamagotchi</a>

        {% if current_user.is_authenticated %}
          <div class="site-user">
            <span>Logado como {{ current_user.username }}</span>

            <form class="logout-form" method="post" action="/auth/logout">
              <button class="logout-button" type="submit">Sair</button>
            </form>
          </div>
        {% endif %}
      </div>
    </header>

    <main>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <ul class="flash-list">
            {% for message in messages %}
              <li>{{ message }}</li>
            {% endfor %}
          </ul>
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>
  </body>
</html>
